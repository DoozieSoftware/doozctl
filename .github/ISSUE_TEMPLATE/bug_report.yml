name: Bug report
description: Report a problem with DoozCTL
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: DoozCTL version
      description: Output of `doozctl --version`
      placeholder: "0.3.0-alpha.1"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact command and arguments you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The exact output or error message.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps and, if possible, a minimal repository that reproduces it.
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
