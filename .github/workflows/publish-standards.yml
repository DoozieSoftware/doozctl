name: Publish Standards Sample

on:
  push:
    tags:
      - "standards-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @dooziesoft/doozctl-standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Update npm (OIDC requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#standards-v}"
          VERSION="$VERSION" node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('standards/package.json', 'utf8'));
            p.version = process.env.VERSION;
            fs.writeFileSync('standards/package.json', JSON.stringify(p, null, 2) + '\n');
          "
          echo "Publishing @dooziesoft/doozctl-standards@${VERSION}"

      - name: Publish to npm
        working-directory: standards
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
